name: Bug report
description: Something does not look right, the Home crashes or reloads, or an editor option does nothing
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing ZhiThemes! A log helps much more than a long description.
        In the editor's **Logs** tab press **Report a problem…** and attach the report it downloads (for more detail, turn on
        **Debug mode** first and do the thing that fails again). Without the editor: 🎨 ZhiThemes > Tools > Copy logs to USB,
        or `/data/ZhiThemes/Logs/zhithemes.log` by FTP. More in `docs/LOGS.md` in the repository.

  - type: input
    id: version
    attributes:
      label: ZhiThemes version
      description: Shown in the editor's top bar and in the About tab.
      placeholder: "0.1.0-alpha"
    validations:
      required: true

  - type: input
    id: firmware
    attributes:
      label: PS5 firmware
      placeholder: "9.60"
    validations:
      required: true

  - type: input
    id: loader
    attributes:
      label: Jailbreak / loader and other payloads running
      description: For example kstuff, elfldr, etaHEN, an FTP server…
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you saw instead.
    validations:
      required: true

  - type: textarea
    id: theme
    attributes:
      label: Theme
      description: Which options were on? You can attach your `.ztheme` (editor → Download), if you are fine with sharing it.

  - type: textarea
    id: log
    attributes:
      label: Log
      description: Attach the report or the log file (drag it here).
      render: text
    validations:
      required: true

  - type: textarea
    id: media
    attributes:
      label: Screenshots or video
      description: Optional, but very useful for anything visual.
